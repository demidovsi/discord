name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          API_URL: ${{ secrets.API_URL }}
          API_URL_LOCAL: ${{ secrets.API_URL_LOCAL }}
          ENCODED_PASSWORD: ${{ secrets.ENCODED_PASSWORD }}
          SCHEMA: ${{ secrets.SCHEMA }}
          APP_LANG: ${{ secrets.APP_LANG }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DISCORD_TOKEN,API_URL,API_URL_LOCAL,ENCODED_PASSWORD,SCHEMA,APP_LANG,GHCR_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            # Login to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull latest image
            docker pull "$IMAGE"

            # Write .env file
            mkdir -p /opt/discord-bot
            cat > /opt/discord-bot/.env << EOF
            DISCORD_TOKEN=${DISCORD_TOKEN}
            API_URL=${API_URL}
            API_URL_LOCAL=${API_URL_LOCAL}
            ENCODED_PASSWORD=${ENCODED_PASSWORD}
            SCHEMA=${SCHEMA}
            APP_LANG=${APP_LANG}
            EOF
            chmod 600 /opt/discord-bot/.env

            # Restart container
            docker stop discord-bot 2>/dev/null || true
            docker rm discord-bot 2>/dev/null || true
            docker run -d \
              --name discord-bot \
              --restart unless-stopped \
              --env-file /opt/discord-bot/.env \
              "$IMAGE"

            # Remove dangling images
            docker image prune -f
